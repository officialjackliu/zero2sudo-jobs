# NOTE: this workflow does NOT fetch Instagram stories. It imports the public
# Direct Consideration posts and processes any screenshots in screenshots/.
# Story fetching from Instagram needs a logged-in session, and stories expire
# after 24 hours, so it cannot be automated reliably here. New story jobs
# arrive via the screenshots/ folder (dropped in by a maintainer, or by a
# connected fetch outside Actions); this workflow runs the dedupe /
# classify / update steps over whatever is in screenshots/, rebuilds the
# README tables from jobs.json, and commits the result. It keeps the
# published list fresh and the "Age" column accurate without any scraping.
# See README.md "How updates work" for the full pipeline.

name: Daily job list update

on:
  schedule:
    # Every day at 13:00 UTC (8:00 AM CT / 9:00 AM ET).
    - cron: "0 13 * * *"
  workflow_dispatch: # allow a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Daily run (24h stories, job-only, deduped)
        run: python3 scripts/run_daily.py --source screenshots

      - name: Import latest Direct Consideration posts
        run: |
          python3 scripts/import_blog.py \
            --latest \
            --date-seen "$(date -u +%Y-%m-%d)"

      # OPTIONAL (disabled): pull the public speedyapply list as a secondary
      # cross-check source. Left commented out on purpose — this repo's scope
      # is jobs spotted in @zero2sudo's stories, and scraping that list is
      # not implemented. Enable only if maintainers decide to broaden scope.
      #
      # - name: Fetch speedyapply list (optional, disabled)
      #   run: |
      #     # e.g. curl the speedyapply README and diff new roles against jobs.json
      #     echo "speedyapply cross-check not implemented"

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md jobs.json state/seen_stories.json
          git diff --cached --quiet || git commit -m "Daily job list update"
          git push
